<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Privado | Brisa El Milagro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=35">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-card" id="loginContent">
        <h1 class="splash-logo-text" style="font-size: 3.5rem; margin-bottom: 5px;">Brisa el Milagro</h1>
        <p class="text-white-50 text-uppercase small ls-3 mb-5" style="letter-spacing: 3px;">Portal Administrativo</p>
        
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <button class="btn btn-gold w-100 mb-4" type="submit">ENTRAR AL PORTAL</button>
            <a href="/" class="text-white-50 small text-decoration-none hover-gold">← Volver a la página principal</a>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            // Cerramos la vista del login
            document.getElementById('loginContent').style.opacity = '0';
            
            // Creamos el splash de transición
            const s = document.createElement('div');
            s.className = 'premium-splash active'; // Clase active para que se vea
            s.innerHTML = `<h1 class="splash-logo-text">Verificando acceso...</h1>`;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
