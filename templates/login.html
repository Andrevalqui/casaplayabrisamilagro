<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Privado | {{ info.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-card" id="loginContent">
        <h1 class="splash-logo-text" style="font-size: 3rem;">{{ info.nombre }}</h1>
        <p class="text-white-50 text-uppercase small ls-2 mb-4">Portal Administrativo</p>
        
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control bg-transparent text-white border-secondary" placeholder="Usuario" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control bg-transparent text-white border-secondary" placeholder="Contraseña" required>
            </div>
            <button class="btn btn-gold w-100 mb-3" type="submit">ENTRAR AL PORTAL</button>
            <a href="/" class="text-white-50 small text-decoration-none">← Regresar a la web</a>
        </form>
    </div>

    <script>
        // Splash al enviar formulario
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('loginContent').style.opacity = '0';
            const s = document.createElement('div');
            s.className = 'premium-splash';
            s.innerHTML = '<h1 class="splash-logo-text">VERIFICANDO...</h1><div class="loader-line"></div>';
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
