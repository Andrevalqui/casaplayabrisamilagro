<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login Admin</title>
</head>
<body class="bg-dark text-white d-flex align-items-center" style="height: 100vh;">
    <div class="container" style="max-width: 400px;">
        <div class="card bg-secondary p-4 shadow">
            <h3 class="text-center">Admin Brisa</h3>
            <form method="POST">
                <input type="text" name="username" class="form-control mb-3" placeholder="Usuario" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Contraseña" required>
                <button class="btn btn-warning w-100">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
