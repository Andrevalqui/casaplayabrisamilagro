<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Ediciones | Brisa El Milagro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=35">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 3. SPLASH DE BIENVENIDA (Aparece al entrar) -->
    <div id="adminSplash" class="premium-splash active">
        <div class="text-center">
            <p class="text-white-50 small ls-3 mb-2 text-uppercase">Acceso Concedido</p>
            <h1 class="splash-logo-text">BIENVENIDO AL PORTAL DE EDICIONES</h1>
            <div class="loader-line mx-auto"></div>
        </div>
    </div>

    <nav class="navbar admin-navbar navbar-dark sticky-top shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="#" style="font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: #c5a47e;">Brisa el Milagro</a>
            <div class="d-flex gap-3">
                <button onclick="transitionTo('/', 'REDIRECCIONANDO A LA PÁGINA WEB...')" class="btn btn-outline-light btn-sm rounded-pill px-4">
                    <i class="fas fa-external-link-alt me-2"></i> IR AL PORTAL WEB
                </button>
                <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-4">
                    <i class="fas fa-power-off me-2"></i> CERRAR SESIÓN
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <!-- [MANTENER AQUÍ EL RESTO DEL CONTENIDO DE TUS CARDS DE CALENDARIO Y GALERÍA] -->
        <div class="row g-5">
             <div class="col-lg-4">
                <div class="card admin-card p-4 h-100 shadow-sm border-0" style="border-radius: 20px;">
                    <h5 class="fw-bold mb-4 border-start border-warning border-4 ps-3">CALENDARIO</h5>
                    <form action="/admin/bloquear" method="POST" class="mb-4">
                        <input type="date" name="fecha" class="form-control mb-3" required>
                        <button class="btn btn-gold w-100">BLOQUEAR FECHA</button>
                    </form>
                    <div class="overflow-auto" style="max-height: 300px;">
                        {% for f in fechas %}
                        <div class="d-flex justify-content-between p-2 bg-white rounded shadow-sm mb-2">
                            <span>{{ f.fecha }}</span>
                            <a href="/admin/desbloquear/{{ f.id }}" class="text-danger small">Eliminar</a>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card admin-card p-4 h-100 shadow-sm border-0" style="border-radius: 20px;">
                    <h5 class="fw-bold mb-4 border-start border-warning border-4 ps-3">GALERÍA</h5>
                    <form action="/admin/subir" method="POST" enctype="multipart/form-data" class="mb-4">
                        <div class="input-group">
                            <input type="file" name="archivo" class="form-control" accept="image/*" required>
                            <button class="btn btn-success">SUBIR FOTO</button>
                        </div>
                    </form>
                    <div class="row g-2">
                        {% for foto in fotos %}
                        <div class="col-md-3 position-relative">
                            <img src="{{ foto.url }}" class="img-fluid rounded" style="height: 120px; width: 100%; object-fit: cover;">
                            <a href="/admin/eliminar-foto/{{ foto.id }}" class="btn btn-danger btn-sm position-absolute top-0 end-0">×</a>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ocultar splash inicial
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('adminSplash').classList.remove('active');
            }, 2000);
        });

        // Función de transición para botones
        function transitionTo(url, message) {
            const s = document.createElement('div');
            s.className = 'premium-splash active';
            s.innerHTML = `
                <div class="text-center">
                    <h1 class="splash-logo-text" style="font-size: 2.2rem;">${message}</h1>
                    <div class="loader-line mx-auto"></div>
                </div>`;
            document.body.appendChild(s);
            setTimeout(() => { window.location.href = url; }, 1400);
        }
    </script>
</body>
</html>
