<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Panel de Control | Brisa El Milagro</title>
</head>
<body class="p-4 bg-light">
    <div class="container">
        <h1>Admin - Brisa El Milagro</h1>
        <hr>
        <div class="row">
            <div class="col-md-6 mb-4">
                <h3>Subir Foto a Galería</h3>
                <form action="/admin/subir" method="POST" enctype="multipart/form-data" class="card p-3 shadow-sm">
                    <input type="file" name="archivo" class="form-control mb-2" required>
                    <button class="btn btn-success">Subir a Cloudinary</button>
                </form>
                <div class="mt-3 row">
                    {% for f in fotos %}
                    <div class="col-4 mb-2 position-relative">
                        <img src="{{ f.url }}" class="img-fluid rounded shadow-sm">
                        <a href="/admin/eliminar-foto/{{ f.id }}" class="btn btn-danger btn-sm position-absolute top-0 end-0">X</a>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Bloquear Fechas</h3>
                <form action="/admin/bloquear" method="POST" class="card p-3 shadow-sm mb-3">
                    <input type="date" name="fecha" class="form-control mb-2" required>
                    <button class="btn btn-primary">Bloquear Fecha</button>
                </form>
                <ul class="list-group">
                    {% for f in fechas %}
                    <li class="list-group-item d-flex justify-content-between">
                        {{ f.fecha }}
                        <a href="/admin/desbloquear/{{ f.id }}" class="text-danger">Desbloquear</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
