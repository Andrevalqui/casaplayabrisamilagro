<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Edición | {{ info.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- SPLASH DE BIENVENIDA AL CARGAR -->
    <div id="adminSplash" class="premium-splash">
        <h1 class="splash-logo-text">BIENVENIDO, {{ current_user.username.upper() }}</h1>
        <p class="text-white-50">Cargando herramientas de edición...</p>
        <div class="loader-line"></div>
    </div>

    <nav class="navbar admin-navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#" style="font-family: 'Great Vibes', cursive; font-size: 2rem;">Panel Brisa</a>
            <div class="d-flex gap-2">
                <a href="javascript:void(0)" onclick="transitionTo('/', 'REDERIGIENDO AL PORTAL WEB...')" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fas fa-globe me-1"></i> VER WEB
                </a>
                <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3">
                    <i class="fas fa-sign-out-alt"></i> SALIR
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <!-- SECCIÓN CALENDARIO -->
            <div class="col-lg-5">
                <div class="card admin-card p-4 h-100">
                    <h4 class="mb-4 text-dark font-weight-bold"><i class="fas fa-calendar-alt text-warning me-2"></i> Bloquear Reservas</h4>
                    <form action="/admin/bloquear" method="POST" class="mb-4">
                        <label class="small text-muted">Seleccione fecha para marcar como ocupada:</label>
                        <div class="input-group mt-2">
                            <input type="date" name="fecha" class="form-control" required>
                            <button class="btn btn-gold">BLOQUEAR</button>
                        </div>
                    </form>
                    <div class="list-group overflow-auto" style="max-height: 300px;">
                        {% for f in fechas %}
                        <div class="list-group-item d-flex justify-content-between align-items-center border-0 bg-light mb-2 rounded">
                            <span class="fw-bold text-dark">{{ f.fecha }}</span>
                            <a href="/admin/desbloquear/{{ f.id }}" class="btn btn-sm btn-outline-danger border-0"><i class="fas fa-trash"></i></a>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <!-- SECCIÓN GALERÍA -->
            <div class="col-lg-7">
                <div class="card admin-card p-4 h-100">
                    <h4 class="mb-4 text-dark font-weight-bold"><i class="fas fa-camera-retro text-success me-2"></i> Galería de Espacios</h4>
                    <form action="/admin/subir" method="POST" enctype="multipart/form-data" class="mb-4">
                        <div class="input-group">
                            <input type="file" name="archivo" class="form-control" accept="image/*" required>
                            <button class="btn btn-success">SUBIR A CLOUDINARY</button>
                        </div>
                    </form>
                    <div class="row g-3">
                        {% for foto in fotos %}
                        <div class="col-md-4 position-relative">
                            <img src="{{ foto.url }}" class="img-fluid rounded shadow-sm" style="height: 120px; width: 100%; object-fit: cover;">
                            <a href="/admin/eliminar-foto/{{ foto.id }}" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1" title="Eliminar foto">×</a>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ocultar splash inicial
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('adminSplash').style.opacity = '0';
                setTimeout(() => document.getElementById('adminSplash').style.display = 'none', 800);
            }, 2000);
        });

        // Función reutilizable para redirecciones con splash
        function transitionTo(url, message) {
            const s = document.createElement('div');
            s.className = 'premium-splash';
            s.style.opacity = '0';
            s.innerHTML = `<h1 class="splash-logo-text" style="font-size:2rem">${message}</h1><div class="loader-line"></div>`;
            document.body.appendChild(s);
            setTimeout(() => {
                s.style.opacity = '1';
                setTimeout(() => window.location.href = url, 1200);
            }, 10);
        }
    </script>
</body>
</html>
